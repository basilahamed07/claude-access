name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      AGENTSHIELD_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      AGENTSHIELD_TEST_REDIS: redis://localhost:6379/0
    defaults: { run: { working-directory: agentshield } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy
      - run: pytest -q -m "not slow"
  contract:
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      AGENTSHIELD_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      AGENTSHIELD_TEST_REDIS: redis://localhost:6379/0
      PY: python
      SCHEMATHESIS: schemathesis
    defaults: { run: { working-directory: agentshield } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: openapi.json is up to date
        run: python scripts/export_openapi.py --check
      - name: schemathesis (no 5xx, responses match the contract)
        run: ./scripts/schemathesis.sh
  dashboard:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: dashboard } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: npm ci
      - name: API types are up to date with openapi.json
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      AGENTSHIELD_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
      AGENTSHIELD_TEST_REDIS: redis://localhost:6379/0
      PY: python
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - run: pip install -e "agentshield[dev]"
      - run: npm ci
        working-directory: dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: dashboard
      - name: attack replay and accessibility against the real stack
        run: npx playwright test
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: dashboard/test-results }
